<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants | HungerStation</title>
    <link rel="stylesheet" href="style.css?v=hungerstation-restaurants">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="platform-customer-body">
    <header class="platform-customer-header">
        <a class="platform-customer-brand" href="restaurants.html">Hunger<span>Station</span></a>
        <a class="platform-home-link" href="index.html">Current Restaurant</a>
    </header>
    <main>
        <section class="restaurant-directory-hero">
            <p class="directory-kicker">Order from restaurants you trust</p>
            <h1>Find your next meal.</h1>
            <p>Browse approved HungerStation restaurants, view their menus, and order directly.</p>
            <label class="restaurant-search" for="restaurant-search-input">
                <span>Search restaurants</span>
                <input id="restaurant-search-input" type="search" placeholder="Search by name, address, or area">
            </label>
        </section>
        <section class="restaurant-directory-section">
            <div class="directory-heading"><div><p class="directory-kicker">Available now</p><h2>Restaurants near you</h2></div><span id="restaurant-count"></span></div>
            <div id="restaurant-directory-list" class="restaurant-directory-grid" aria-live="polite"></div>
        </section>
    </main>
    <script src="restaurants.js"></script>
</body>
</html>
