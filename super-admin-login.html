<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HungerStation Super Admin</title>
    <link rel="stylesheet" href="style.css?v=hungerstation-phase1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="super-admin-body">
    <main class="super-login-shell">
        <section class="super-login-intro">
            <span class="super-kicker">HungerStation</span>
            <h1>Run the platform behind every restaurant.</h1>
            <p>Secure access for platform operations, restaurant onboarding, and service-fee oversight.</p>
        </section>
        <section class="super-login-card">
            <h2>Super Admin</h2>
            <p>Sign in with your platform credentials.</p>
            <label for="super-admin-username">Username</label>
            <input id="super-admin-username" type="text" autocomplete="username">
            <label for="super-admin-password">Password</label>
            <input id="super-admin-password" type="password" autocomplete="current-password">
            <p id="super-admin-login-status" class="payment-status" aria-live="polite"></p>
            <button id="super-admin-login-btn" type="button">Open Dashboard</button>
        </section>
    </main>
    <script src="super-admin-login.js"></script>
</body>
</html>
