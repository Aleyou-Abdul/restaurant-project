<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Admin Login | PlateRoute</title>
    <link rel="stylesheet" href="style.css?v=20261020a">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-login-screen">
        <div class="admin-login-card">
            <h3>PlateRoute Business Login</h3>
            <p class="order-note-help">Choose your approved restaurant or home food vendor account, then sign in to manage orders, your menu, and business details.</p>
            <label for="admin-restaurant">Your business</label>
            <select id="admin-restaurant" autocomplete="organization" disabled>
                <option value="">Loading approved businesses...</option>
            </select>
            <label for="admin-username">Username</label>
            <input id="admin-username" type="text" autocomplete="username">
            <label for="admin-password">Password</label>
            <input id="admin-password" type="password" autocomplete="current-password">
            <p id="admin-login-status" class="payment-status"></p>
            <button id="admin-login-btn" type="button">Log In</button>
        </div>
    </div>

    <script src="admin-login.js?v=20261020a"></script>
</body>
</html>
