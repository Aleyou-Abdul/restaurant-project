services:
  - type: web
    name: plateroute
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    disk:
      name: plateroute-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: STORAGE_ROOT
        value: /opt/render/project/src/storage
      - key: BACKUP_HOUR
        value: 3
      - key: BACKUP_RETENTION_DAYS
        value: 14
